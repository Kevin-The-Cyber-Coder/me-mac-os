    <script>
      ;(() => {
        try {
          const stored = JSON.parse(localStorage.getItem('kcp-ui') || '{}')
          const theme = stored?.state?.theme || 'dark'
          const resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(resolved)
          const accent = stored?.state?.accent
          const accents = {
            violet: '#7c5cff',
            cyan: '#22d3ee',
            blue: '#3b82f6',
            emerald: '#34d399',
            rose: '#fb7185',
            amber: '#f59e0b',
          }
          if (accent && accents[accent]) document.documentElement.style.setProperty('--accent', accents[accent])
        } catch {}
      })()
    </script>
