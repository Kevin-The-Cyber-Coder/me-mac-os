<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Kevin The Cyber Coder</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #141a36, #05060c 60%);
        color: #e8ecff;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        padding: 36px;
        border-radius: 20px;
        border: 1px solid #1e2540;
        background: rgba(13, 18, 34, 0.72);
        backdrop-filter: blur(18px);
      }
      .badge {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: #8b9bff;
        text-transform: uppercase;
      }
      h1 { font-size: 22px; margin: 14px 0 10px; }
      p { color: #98a2c6; font-size: 14px; line-height: 1.7; }
      button {
        margin-top: 18px;
        padding: 10px 18px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        background: linear-gradient(90deg, #7c5cff, #22d3ee);
        color: #05060c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Kevin The Cyber Coder</div>
      <h1>You're offline</h1>
      <p>
        The portfolio shell is cached, but this page needs a network connection. Reconnect and try again — ARENA AI and
        live GitHub data require the API.
      </p>
      <button onclick="location.reload()">Retry connection</button>
    </div>
  </body>
</html>
