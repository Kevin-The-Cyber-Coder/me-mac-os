name: Bug report
description: Something on the desktop or API is not working as expected.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please avoid pasting secrets, tokens or private data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the desktop
        2. Double click Projects
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system and viewport width.
      placeholder: Edge 131 on Windows 11, 1440 × 900
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console or network output
      description: Paste any errors from the browser console or API logs.
      render: text
    validations:
      required: false
